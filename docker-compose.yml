services:
  # === MÓDULO gRPC (Ativo) ===
  grpc_server:
    build: 
      context: ./grpc/server
    container_name: grpc_server
    ports:
      - "50051:50051"

  grpc_client:
    build: 
      context: ./grpc/client
    container_name: grpc_client
    depends_on:
      - grpc_server

