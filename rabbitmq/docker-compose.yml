services:
  # === MÓDULO RABBITMQ ===
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "admin123"

  rabbitmq_consumer:
    build:
      context: ./consumer
    container_name: rabbitmq_consumer
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "admin"
      RABBITMQ_PASS: "admin123"

  rabbitmq_producer:
    build:
      context: ./producer
    container_name: rabbitmq_producer
    volumes:
      - ./producer:/app
    depends_on:
      - rabbitmq
      - rabbitmq_consumer
    environment:
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "admin"
      RABBITMQ_PASS: "admin123"
