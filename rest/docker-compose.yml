services:
  rest_server_1:
    build: ./server
    container_name: rest_server_1
    environment:
      SERVER_ID: rest_server_1

  rest_server_2:
    build: ./server
    container_name: rest_server_2
    environment:
      SERVER_ID: rest_server_2

  rest_server_3:
    build: ./server
    container_name: rest_server_3
    environment:
      SERVER_ID: rest_server_3

  rest_nginx:
    image: nginx:1.27-alpine
    container_name: rest_nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rest_server_1
      - rest_server_2
      - rest_server_3

  rest_client:
    build: ./client
    container_name: rest_client
    depends_on:
      - rest_nginx