events {}

http {
    upstream servidores_rest {
        server rest_server_1:8080;
        server rest_server_2:8080;
        server rest_server_3:8080;
    }

    proxy_connect_timeout 1s;

    server {
        listen 8080;
        location / {
            proxy_pass http://servidores_rest;
        }
    }
}